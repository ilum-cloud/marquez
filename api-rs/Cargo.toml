[workspace]
resolver = "2"
members = [
    "marquez-api",
    "marquez-search",
    "marquez-graphql",
    "marquez-tracing",
    "tests",
]

[workspace.dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
hyper = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Common types
uuid = { version = "1", features = ["v3", "v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error tracking
sentry = { version = "0.35", features = ["tracing", "tower", "tower-http"] }
sentry-tower = { version = "0.35", features = ["http"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["yaml", "env"] }

# Async utilities
tokio-util = "0.7"

# Encoding
percent-encoding = "2"

# Search
opensearch = "2"

# Hashing
sha2 = "0.10"
md5 = "0.7"

# Testing
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
reqwest = { version = "0.12", features = ["json"] }
rand = "0.9"
